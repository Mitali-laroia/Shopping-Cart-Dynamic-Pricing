# Test environment configuration
# Note: spring.profiles.active cannot be set in profile-specific files in Spring Boot 3.x

# Logging for Test environment
logging.level.com.example.shoppingcart=DEBUG
logging.level.org.mybatis=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Use in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# MyBatis configuration for tests
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.example.shoppingcart.model
mybatis.mapper-locations=classpath:mapper/*.xml

# H2 Console (for debugging tests if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql