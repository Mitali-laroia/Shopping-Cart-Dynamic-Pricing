version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shopping-cart-postgres
    environment:
      POSTGRES_DB: shopping_cart_db
      POSTGRES_USER: shopping_cart_user
      POSTGRES_PASSWORD: shopping_cart_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - shopping-cart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_cart_user -d shopping_cart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping-cart-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopping_cart_db
      SPRING_DATASOURCE_USERNAME: shopping_cart_user
      SPRING_DATASOURCE_PASSWORD: shopping_cart_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      LOGGING_FILE_PATH: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/app/logs
    networks:
      - shopping-cart-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shopping-cart-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shopping-cart.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - shopping-cart-network
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local
  pgadmin_data:
    driver: local

networks:
  shopping-cart-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16